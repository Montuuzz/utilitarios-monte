<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Contactate con Utilitarios Monte para consultas sobre vehículos utilitarios, pickups y camiones. Estamos para asesorarte y ayudarte a encontrar la mejor opción para tu negocio o empresa.">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <title>Contactanos - Utilitarios Monte</title>
</head>
<body>

<header>
    <nav class="navbar container">
        <a href="../index.html" class="navbar-brand" title="Ir al inicio - Utilitarios Monte">
            <img src="../img/LOGO.png" height="60" alt="Logo oficial de Utilitarios Monte" title="Utilitarios Monte - Vehículos comerciales y utilitarios">
        </a>

        <button class="navbar-toggler" data-bs-toggle="offcanvas" data-bs-target="#menu" title="Abrir menú de navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>
</header>

<div class="offcanvas offcanvas-end" id="menu">
    <div class="offcanvas-header">
        <h5>Menú</h5>
        <button class="btn-close" data-bs-dismiss="offcanvas" title="Cerrar menú"></button>
    </div>

    <div class="offcanvas-body">
        <ul class="navbar-nav">
            <li><a class="nav-link" href="../index.html" title="Ir a la página de inicio">Inicio</a></li>
            <li><a class="nav-link" href="../pages/productos.html" title="Ver catálogo de productos">Productos</a></li>
            <li><a class="nav-link" href="../pages/about.html" title="Conocé más sobre Utilitarios Monte">Sobre Nosotros</a></li>
        </ul>
    </div>
</div>

<main class="container mt-4">
    <h1 class="text-center mb-4">Dejanos tu consulta</h1>

    <form>
        <label title="Ingresá tu nombre completo">Nombre</label>
        <input type="text" title="Campo para ingresar tu nombre">

        <label title="Ingresá tu apellido completo">Apellido</label>
        <input type="text" title="Campo para ingresar tu apellido">

        <label title="Ingresá tu correo electrónico">Email</label>
        <input type="email" title="Campo para ingresar tu correo electrónico">

        <label title="Escribí tu consulta o mensaje">Mensaje</label>
        <textarea title="Campo para escribir tu mensaje o consulta"></textarea>

        <button type="submit" title="Enviar formulario de contacto">Enviar</button>
    </form>
</main>

<footer class="text-center mt-4">
    <p>© 2025 Utilitarios Monte</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
